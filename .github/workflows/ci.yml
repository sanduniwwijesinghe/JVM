name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: pytest -v
      - name: Smoke test installed CLI on sample dumps
        run: |
          jvm-diag --version
          jvm-diag analyze --thread-dump examples/sample_deadlock_thread_dump.txt \
            --mode summary --output /tmp/out/deadlock_report.txt
          grep -q "Deadlock detected" /tmp/out/deadlock_report.txt
