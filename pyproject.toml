[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jvm-diagnostics-copilot"
version = "1.1.0"
description = "Local, read-only JVM thread dump and heap analysis that produces RCA evidence and AI-ready prompts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sanduni Wijesinghe" }]
keywords = ["jvm", "thread-dump", "deadlock", "heap", "sre", "root-cause-analysis"]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
jvm-diag = "jvm_diagnostics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jvm_diagnostics = ["default_config.yaml", "generators/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F", "B"]
